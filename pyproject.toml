[project]
name = "roboarm"
version = "0.1.0"
description = "Piper 机械臂 + LinkerHand O6 灵巧手：平掌包络抓取、2D 手眼标定、YOLO 目标检测与 MuJoCo 仿真"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- 机械臂（Piper / CAN）---
    "piper-sdk>=0.6.1",          # Piper 官方 SDK（C_PiperInterface_V2）
    "python-can[gs-usb]>=4.6.1", # CAN 总线（USB-CAN 适配器，gs_usb 内核模块）
    # --- 运动学 / 数学 ---
    "kinpy>=0.5.6",              # URDF 串链与前向运动学（IK 代价、姿态校验）
    "numpy>=1.24",
    "scipy>=1.10",               # 旋转、SLSQP 逆运动学
    "typing-extensions>=4.0",    # arm_base 用到
    # --- 视觉 / 检测 ---
    "opencv-python>=4.8",
    "ultralytics>=8.4.37",       # YOLO 推理（object_detect/detect.py、model_server.py）
    "pyorbbecsdk2>=2.0.18",      # Orbbec 深度相机（camera/orb_camera*.py）
    "requests>=2.33.1",          # 远程相机客户端
    # --- Web / 显示（无头模式把画面通过 Flask 提供）---
    "flask>=3.1.3",
    # --- 配置 / 杂项 ---
    "pyyaml>=6.0",               # utils/config_getter.py、灵巧手 SDK 均 import yaml
    # --- 灵巧手（LinkerHand O6，Modbus RTU/RS485）---
    # SDK 的 requirements.txt 固定 pymodbus==3.5.1（core/rs485 驱动按 3.5.x API 编写），
    # 此处跟随；pymodbus 会带上 pyserial。CAN 模式的灵巧手则用上方的 python-can。
    "pymodbus==3.5.1",
    # --- MuJoCo 仿真（sim/piper_linker）---
    "mujoco>=3.2",
    "pillow>=10.0",              # server.py 的视频帧编码
    "fastapi>=0.110",            # server.py Web 服务
    "uvicorn>=0.29",             # server.py 启动
    "websockets>=12.0",          # bridge_client.py 与仿真桥接
]

# 说明：
# - torch 由 ultralytics 传递引入；Jetson 上如需 NVIDIA GPU 版 torch，请自行安装
#   （本仓库不再附带 wheels/ 与 stubs/，也不再有 lerobot/本地 torch 源）。
# - 灵巧手 SDK（third_party/linkerhand-python-sdk）以 git submodule 提供，不是 pip 包：
#   用 `git submodule update --init` 拉取，并在 config.yaml 里设置 linker_hand_sdk_path
#   （或设 PYTHONPATH），见 README「灵巧手（LinkerHand O6）环境准备」。
